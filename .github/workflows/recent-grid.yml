# 최근 12주 기여 그래프(scripts/recent-grid.mjs)를 만들어 output 브랜치에 올린다.
# README는 raw.githubusercontent.com/znan2/znan2/output/… 를 그린다(외부 카드 서비스에 기대지 않음).
# 2026-10-26: 1년 전체를 그리던 뱀 애니메이션(Platane/snk)에서 최근 기간만 크게 보이는 그래프로 바꿨다.
name: recent-grid

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/recent-grid.mjs ${{ github.repository_owner }} dist 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
